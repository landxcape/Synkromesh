name: Synkromesh Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish formal GitHub Release'
        required: false
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up OpenJDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android NDK & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > synkromesh-release.jks
          cat <<EOF > keystore.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=synkromesh-release.jks
          EOF

      - name: Setup Fallback Release Keystore
        run: |
          if [ ! -f "keystore.properties" ] && [ ! -f "synkromesh-release.jks" ]; then
            keytool -genkey -noprompt -keystore synkromesh-release.jks \
              -alias synkromesh -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass synkromesh -keypass synkromesh \
              -dname "CN=Synkromesh, OU=Mobile, O=Landxcape, L=Unknown, ST=Unknown, C=US"
            cat <<EOF > keystore.properties
          storePassword=synkromesh
          keyPassword=synkromesh
          keyAlias=synkromesh
          storeFile=synkromesh-release.jks
          EOF
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Build Split Release APKs & Bundle
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/synkromesh-*.apk release-artifacts/
          cp app/build/outputs/bundle/release/app-release.aab release-artifacts/synkromesh-v0.1.0-b1-app-release.aab
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synkromesh-release-assets
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
